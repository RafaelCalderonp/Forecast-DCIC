<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none">
  <!-- Fondo azul oscuro propio — el logo es autónomo, funciona sobre cualquier fondo -->
  <rect width="220" height="52" fill="#1C2A3E"/>
  <!-- Caja DCIC: borde blanco, sin fill -->
  <rect x="8" y="8" width="72" height="36" rx="2" fill="none" stroke="white" stroke-width="1.8"/>
  <!-- Letras DCIC en blanco -->
  <text x="18" y="33" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="white" letter-spacing="4">DCIC</text>
  <!-- Separador vertical -->
  <line x1="90" y1="12" x2="90" y2="40" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <!-- GROUP en blanco -->
  <text x="100" y="33" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="white" letter-spacing="1">GROUP</text>
</svg>
