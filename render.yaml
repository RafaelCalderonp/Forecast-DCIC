databases:
  - name: forecast-dcic-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: forecast-dcic-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: Proyecto Forecast/backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: forecast-dcic-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ERP_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
