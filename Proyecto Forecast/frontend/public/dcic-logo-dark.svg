<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none">
  <!-- Rectángulo con borde teal (color accent corporativo DCIC) -->
  <rect x="1" y="1" width="80" height="42" rx="3" fill="none" stroke="#0D9488" stroke-width="1.8"/>
  <!-- Letras DCIC en teal -->
  <text x="9" y="30" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#0D9488" letter-spacing="5">DCIC</text>
  <!-- Separador vertical -->
  <line x1="90" y1="8" x2="90" y2="36" stroke="rgba(15,23,42,0.18)" stroke-width="1"/>
  <!-- GROUP en slate oscuro -->
  <text x="99" y="30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1C2436" letter-spacing="0.5">GROUP</text>
</svg>
